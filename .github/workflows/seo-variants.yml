name: Check SEO variants

on:
  push:
  pull_request:

jobs:
  variants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node --test tests/seo-variants.test.cjs
      - run: node scripts/build-production-html.cjs
